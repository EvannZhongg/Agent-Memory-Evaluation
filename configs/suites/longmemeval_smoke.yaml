suite:
  name: longmemeval_smoke
  benchmark:
    name: longmemeval
    dataset_path: LongMemEval/data/longmemeval_s_cleaned_smoke_1.json
    evaluation:
      enabled: false

  agent:
    llm_config_path: configs/llm/responses.yaml
    top_k: 10

  backends:
    - name: no_memory
      config_path: configs/memory/no_memory.yaml
    - name: mem0
      config_path: configs/memory/mem0.yaml
    - name: amem
      config_path: configs/memory/amem.yaml
    - name: memoryos
      config_path: configs/memory/memoryos.yaml

  run:
    run_dir_template: runs/{suite}_{backend}
